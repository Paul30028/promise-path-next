<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应许之路 · 七人模型审查</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee7d7;font-family:'Microsoft YaHei',sans-serif;color:#304739}header{height:64px;padding:12px 28px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:22px;font-family:serif}header span{font-size:13px;color:#6b7368}#stage{height:calc(100vh - 142px);min-height:380px}.labels{height:78px;display:grid;grid-template-columns:repeat(7,1fr);padding:12px 25px;gap:4px}.labels div{text-align:center;border-top:2px solid #b6aa8e;padding-top:7px}.labels b,.labels small{display:block}.labels b{font-size:14px}.labels small{font-size:11px;color:#7a776a}
</style></head><body><header><h1>应许之路 · 角色建模样板</h1><span>真实 glTF 模型 · 七人同镜头 · 第二轮审核</span></header><div id="stage"></div><section class="labels"><div><b>亚伯兰</b><small>领队</small></div><div><b>撒莱</b><small>管事</small></div><div><b>罗得</b><small>牧人</small></div><div><b>以利</b><small>侦察</small></div><div><b>努拉</b><small>取水</small></div><div><b>亚撒</b><small>工匠</small></div><div><b>玛拉</b><small>长者</small></div></section><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const stage=document.getElementById('stage');const scene=new THREE.Scene();scene.background=new THREE.Color('#e8dfcd');const camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,.1,100);camera.position.set(0,2.1,7.5);camera.lookAt(0,.7,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight('#fff2d9',2));const sun=new THREE.DirectionalLight('#fff1d1',3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,3),new THREE.MeshStandardMaterial({color:'#cdbb98',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ids=['abram','sarai','lot','eli','nura','asa','mara'];const loader=new GLTFLoader();await Promise.all(ids.map(async(id,i)=>{const gltf=await loader.loadAsync(`/models/character_${id}.glb`);gltf.scene.position.set((i-3)*1.55,0,0);scene.add(gltf.scene);}));
function resize(){camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.render(scene,camera)}window.addEventListener('resize',resize);resize();
</script></body></html>

    x: 576, y: 564, fogMode: 'unvisited', status: 'locked',
    summary: '安营西乃山麓领受十诫与会幕样式，统筹十二支派巧匠建造会幕与约柜，云彩荣光充满帐幕。',

    x: 918, y: 560, fogMode: 'unvisited', status: 'bridge',
    summary: '历经旷野四十年试炼与吗哪供应，摩西于尼波山遥望应许之地并将权柄交棒约书亚，全营集结什亭。',
    canonAnchor: '申 31 & 34 摩西交棒、眺望应许之地。',

  },
  {

    protagonist: '约书亚', titleZh: '约旦河十二石立碑', ref: '书 3–4', locationZh: '约旦河渡口 · 吉甲',
    x: 805, y: 342, fogMode: 'military', status: 'locked',
    summary: '抬约柜的祭司脚一入水，涨溢的约旦河水立起成垒，十二支派取河中十二石在吉甲立为纪念。',
    canonAnchor: '书 3:14–4:24 约柜前导、吉甲立十二石碑。',

  {

    summary: '士师世代屡经背离—呼求—拯救循环；基甸于哈律泉筛选三百勇士，三路携角、空瓶与火把夜袭米甸联军。',
    canonAnchor: '士 7:4–22 三百勇士三路吹角破瓶夜袭。',

  },
  {
    id: 'b07-kingdom-rise', code: 'B07', kind: 'bridge', eraId: 'kingdom', eraZh: '纪年桥接 · 撒上 1–31',
    protagonist: '撒母耳 / 扫罗 / 大卫', titleZh: '士师尾声与王国兴起', ref: '撒上 1–31', locationZh: '示罗 → 拉玛 → 伯利恒',
    x: 695, y: 292, fogMode: 'unvisited', status: 'bridge',
    summary: '先知撒母耳膏立君王，扫罗起落，少年大卫在伯利恒受膏、历经旷野磨炼，终在希伯仑受膏作王。',

  {
    id: 'mount-zion', code: '11', kind: 'chapter', eraId: 'kingdom', eraZh: '第十一章 · 联合王国（第一季终点）',

    x: 744, y: 392, fogMode: 'military', status: 'locked',
    summary: '大卫经水道奇袭攻取锡安保障、欢呼迎约柜入城，领受永恒国度的大卫之约——第一季辉煌收官，第二季预留分裂王国与被掳归回。',
    canonAnchor: '撒下 5–7 建都锡安、迎约柜、大卫之约。',
    adaptations: ['水道奇袭与圣城营建']
  },

const TRAILS = [
  { eraId: 'ur_call', color: '#f5a94c', pts: [[1210,122],[1045,148],[845,220],[688,342],[248,545],[688,342]] },
  { eraId: 'patriarchs', color: '#ecc97b', pts: [[688,342],[774,158],[565,452],[616,492],[842,266]] },
  { eraId: 'exodus', color: '#e8964e', pts: [[348,505],[424,558],[576,564],[918,560]] },
  { eraId: 'conquest', color: '#e06a56', pts: [[918,560],[805,342],[882,348],[756,215]] },
  { eraId: 'kingdom', color: '#9ec7e8', pts: [[565,452],[744,392]] },
];

let activeEra = 'all';
let selectedId = 'p01-ur';
let scale = 1.0, tx = 0, ty = 0;
let dragging = false, dragStart = { x: 0, y: 0 };
let tourTimer = null;

const svg = document.getElementById('mapSvg');
const worldGroup = document.getElementById('worldGroup');
const trailsLayer = document.getElementById('trailsLayer');
const nodesLayer = document.getElementById('nodesLayer');
const dossier = document.getElementById('dossier');
const eraBar = document.getElementById('eraBar');
const zoomReadout = document.getElementById('zoomReadout');

function applyTransform(smooth = false) {
  worldGroup.style.transition = smooth ? 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
  worldGroup.setAttribute('transform', `translate(${tx.toFixed(1)}, ${ty.toFixed(1)}) scale(${scale.toFixed(3)})`);
  zoomReadout.textContent = `${Math.round(scale * 100)}%`;
}

function focusOn(wx, wy, targetScale = 1.85) {
  scale = Math.max(0.85, Math.min(3.2, targetScale));
  tx = 560 - wx * scale;
  ty = 384 - wy * scale;
  applyTransform(true);
}

function renderEraButtons() {
  eraBar.innerHTML = '';
  ERAS.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'era-btn' + (e.id === activeEra ? ' active' : '');
    btn.textContent = e.label;
    btn.onclick = () => {
      stopTour();
      activeEra = e.id;
      renderAll();
      if (activeEra === 'all') { scale = 1.0; tx = 0; ty = 0; applyTransform(true); return; }
      const first = NODES.find(n => n.eraId === activeEra);
      if (first) { selectedId = first.id; renderAll(); focusOn(first.x, first.y, 1.55); }
    };
    eraBar.appendChild(btn);
  });
}

function renderTrails() {
  trailsLayer.innerHTML = '';
  TRAILS.forEach(t => {
    const active = activeEra === 'all' || activeEra === t.eraId;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M ' + t.pts.map(pt => `${pt[0]},${pt[1]}`).join(' L '));
    p.setAttribute('stroke', t.color);
    p.setAttribute('stroke-width', active ? '2.8' : '1.4');
    p.setAttribute('stroke-opacity', active ? '0.88' : '0.20');
    if (active) p.setAttribute('class', 'trail-flow');
    trailsLayer.appendChild(p);
  });
}

function renderNodes() {
  nodesLayer.innerHTML = '';
  NODES.forEach(n => {
    const visible = activeEra === 'all' || n.eraId === activeEra;
    const isSel = n.id === selectedId;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'map-node');
    g.setAttribute('opacity', visible ? '1' : '0.22');

    const col = n.kind === 'prologue' ? '#f5a94c'
      : n.kind === 'bridge' ? '#9ec7e8'
      : n.status === 'current' ? '#ecc97b'
      : n.fogMode === 'military' ? '#e06a56' : '#d6b66f';

    const shape = n.kind === 'bridge'
      ? `<rect class="node-outline" x="${n.x - 7}" y="${n.y - 7}" width="14" height="14" transform="rotate(45 ${n.x} ${n.y})" fill="#1a140e" stroke="${isSel ? '#ffffff' : col}" stroke-width="${isSel ? 2.6 : 1.8}" filter="url(#glow)" />
         <text x="${n.x}" y="${n.y + 3}" text-anchor="middle" fill="${col}" font-size="7" font-weight="800" pointer-events="none">${n.code}</text>`
      : `${isSel || n.status === 'current' || n.kind === 'prologue' ? `<circle class="pulse" cx="${n.x}" cy="${n.y}" r="10" fill="none" stroke="${col}" stroke-width="1.8" />` : ''}
         <circle class="node-outline" cx="${n.x}" cy="${n.y}" r="${isSel ? 10.5 : 8.5}" fill="#1a140e" stroke="${isSel ? '#ffffff' : col}" stroke-width="${isSel ? 2.8 : 2}" filter="url(#glow)" />
         <circle cx="${n.x}" cy="${n.y}" r="5.2" fill="${col}" />
         <text x="${n.x}" y="${n.y + 2.8}" text-anchor="middle" fill="#15100a" font-size="7.5" font-weight="800" pointer-events="none">${n.code}</text>`;

    const showLbl = isSel || n.kind !== 'bridge' || activeEra !== 'all';
    const shortTitle = n.titleZh.length > 13 ? n.titleZh.slice(0, 12) + '…' : n.titleZh;
    const lw = Math.max(78, shortTitle.length * 10 + 14);
    const labelHtml = showLbl ? `
      <g transform="translate(${n.x + 12}, ${n.y - 12})" opacity="${isSel ? 1 : 0.88}">
        <rect class="node-label-bg" x="0" y="0" width="${lw}" height="24" rx="5" />
        <text class="node-label" x="6" y="11">${shortTitle}</text>
        <text class="node-ref" x="6" y="20">${n.code} · ${n.ref.slice(0, 14)}</text>
      </g>` : '';

    g.innerHTML = shape + labelHtml;
    g.onclick = (ev) => {
      ev.stopPropagation();
      stopTour();
      selectedId = n.id;
      renderAll();
      focusOn(n.x, n.y, Math.max(scale, 1.75));
    };
    nodesLayer.appendChild(g);
  });
}

function renderDossier() {
  const n = NODES.find(x => x.id === selectedId) || NODES[2];
  const typeBadge = n.kind === 'prologue'
    ? '<span class="badge pro">可玩交互画卷序章</span>'
    : n.kind === 'bridge'
      ? '<span class="badge brg">纪年桥接节点（可回看）</span>'
      : n.fogMode === 'military'
        ? '<span class="badge mil">军事战争迷雾主章</span>'
        : '<span class="badge">主章 · 未抵达遮罩</span>';

  const idx = NODES.findIndex(x => x.id === n.id);
  const nextNode = NODES[(idx + 1) % NODES.length];

  dossier.innerHTML = `
    <div class="dossier-era"><span>${n.eraZh}</span>${typeBadge}</div>
    <h2>${n.code} · ${n.titleZh}</h2>
    <div class="dossier-meta">
      <div><div class="meta-lbl">核心人物</div><div class="meta-val">${n.protagonist}</div></div>
      <div><div class="meta-lbl">经文依据</div><div class="meta-val">${n.ref}</div></div>
      <div><div class="meta-lbl">地理锚点</div><div class="meta-val">${n.locationZh}</div></div>
      <div><div class="meta-lbl">节点类型</div><div class="meta-val">${n.kind === 'chapter' ? '重度 3D 主章' : n.kind === 'prologue' ? '交互画卷序章' : '轻量纪年桥接'}</div></div>
    </div>
    <div class="sec-title">救赎史脉络</div>
    <p>${n.summary}</p>
    <div class="sec-title">经文正典锚点（Canon Anchor · 不可篡改）</div>
    <p>${n.canonAnchor}</p>
    <div class="sec-title">玩法与工程状态</div>
    <div class="tag-row">${n.adaptations.map(a => `<span class="pill">${a}</span>`).join('')}</div>
    <button class="cta-btn" id="btnNextNode">下一站 → ${nextNode.code} · ${nextNode.titleZh.slice(0, 14)}</button>
  `;
  document.getElementById('btnNextNode').onclick = () => {
    stopTour();
    selectedId = nextNode.id;
    renderAll();
    focusOn(nextNode.x, nextNode.y, 1.85);
  };
}

function renderAll() { renderEraButtons(); renderTrails(); renderNodes(); renderDossier(); }

const viewport = document.getElementById('viewport');
viewport.addEventListener('mousedown', (e) => {
  stopTour(); dragging = true; viewport.classList.add('dragging');
  dragStart = { x: e.clientX - tx, y: e.clientY - ty };
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  tx = e.clientX - dragStart.x; ty = e.clientY - dragStart.y;
  applyTransform(false);
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', (e) => {
  e.preventDefault(); stopTour();
  const f = e.deltaY < 0 ? 1.14 : 0.88;
  const ns = Math.max(0.85, Math.min(3.2, scale * f));
  const r = svg.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (1376 / r.width);
  const my = (e.clientY - r.top) * (768 / r.height);
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns; applyTransform(false);
}, { passive: false });

document.getElementById('btnZoomIn').onclick = () => { stopTour(); scale = Math.min(3.2, scale * 1.25); applyTransform(true); };
document.getElementById('btnZoomOut').onclick = () => { stopTour(); scale = Math.max(0.85, scale * 0.8); applyTransform(true); };
document.getElementById('btnReset').onclick = () => { stopTour(); activeEra = 'all'; scale = 1.0; tx = 0; ty = 0; renderAll(); applyTransform(true); };

function stopTour() {
  if (tourTimer) { clearInterval(tourTimer); tourTimer = null; }
  document.getElementById('btnTour').textContent = '▶ 全季巡礼';
  document.getElementById('btnPrologue').textContent = '▶ 体验 P01 出吾珥序章';
}

document.getElementById('btnPrologue').onclick = () => {
  stopTour();
  activeEra = 'ur_call';
  const seq = ['noah-ark', 'b01-babel', 'p01-ur', 'b02-egypt', 'bethel-ai'];
  let i = 0;
  document.getElementById('btnPrologue').textContent = '⏹ 停止序章导览';
  const step = () => {
    const id = seq[i % seq.length];
    const n = NODES.find(x => x.id === id);
    if (n) { selectedId = id; renderAll(); focusOn(n.x, n.y, 1.85); }
    i++;
    if (i >= seq.length) stopTour();
  };
  step();
  tourTimer = setInterval(step, 2600);
};

document.getElementById('btnTour').onclick = () => {
  if (tourTimer) { stopTour(); return; }
  activeEra = 'all';
  let i = 0;
  document.getElementById('btnTour').textContent = '⏹ 停止巡礼';
  const step = () => {
    const n = NODES[i % NODES.length];
    selectedId = n.id; renderAll(); focusOn(n.x, n.y, 1.8);
    i++;
  };
  step();
  tourTimer = setInterval(step, 2400);
};

renderAll();
applyTransform(false);
</script>

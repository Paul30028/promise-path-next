<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>应许之路 · 圣经脉络古代近东—迦南史诗战役画卷（交互原型）</title>
  <style>
    :root {
      --bg-ink: #17120c;
      --panel-bg: rgba(24, 18, 12, 0.90);
      --panel-border: rgba(208, 169, 98, 0.62);
      --gold: #e7c273;
      --gold-soft: #c7a25a;
      --tekhelet: #3b6ea5;
      --pomegranate: #b84b39;
      --cream: #f5ebd6;
      --muted: #b9aa8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #14100b;
      color: var(--cream);
      font-family: "Noto Serif SC", "Songti SC", "Microsoft YaHei", Georgia, serif;
      user-select: none;
    }
    #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #viewport {
      width: 100%; height: 100%;
      cursor: grab;
      background: radial-gradient(circle at 50% 45%, #2b2116 0%, #140f0a 100%);
    }
    #viewport.dragging { cursor: grabbing; }
    svg#mapSvg { width: 100%; height: 100%; display: block; }

    /* Top Header */
    .top-bar {
      position: absolute; top: 14px; left: 16px; right: 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      pointer-events: none; z-index: 20;
    }
    .brand-card {
      pointer-events: auto;
      background: var(--panel-bg);
      border: 1.5px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
    }
    .brand-title { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; }
    .brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .era-bar {
      pointer-events: auto;
      display: flex; flex-wrap: wrap; gap: 6px;
      background: var(--panel-bg);
      border: 1.5px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
    }
    .era-btn {
      background: rgba(255, 240, 210, 0.06);
      color: var(--cream);
      border: 1px solid rgba(208, 169, 98, 0.28);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
    }
    .era-btn:hover { border-color: var(--gold); background: rgba(231, 194, 115, 0.16); }
    .era-btn.active {
      background: linear-gradient(180deg, rgba(231, 194, 115, 0.34), rgba(168, 124, 52, 0.32));
      border-color: var(--gold);
      color: #fff8e8;
      font-weight: 700;
    }

    /* Right Chapter Dossier Panel */
    .dossier {
      position: absolute; top: 82px; right: 16px; bottom: 72px; width: 340px;
      background: var(--panel-bg);
      border: 1.5px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px 18px;
      overflow-y: auto;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: flex; flex-direction: column; gap: 12px;
    }
    .dossier-era {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--gold); letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
      border: 1px solid rgba(231, 194, 115, 0.45); background: rgba(231, 194, 115, 0.12);
    }
    .badge.mil { border-color: rgba(184, 75, 57, 0.7); background: rgba(184, 75, 57, 0.22); color: #ffb9ad; }
    .badge.unv { border-color: rgba(59, 110, 165, 0.7); background: rgba(59, 110, 165, 0.22); color: #b8d8ff; }
    .dossier h2 { font-size: 20px; color: #fff6e2; line-height: 1.3; }
    .dossier-meta {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 10px; border-radius: 10px;
      background: rgba(255, 244, 222, 0.04);
      border: 1px solid rgba(208, 169, 98, 0.2);
      font-size: 12px;
    }
    .meta-lbl { color: var(--muted); font-size: 11px; }
    .meta-val { color: var(--cream); font-weight: 600; margin-top: 2px; }
    .sec-title {
      font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(208, 169, 98, 0.22); padding-bottom: 4px;
    }
    .dossier p { font-size: 13px; line-height: 1.62; color: #e8dcc4; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      font-size: 11px; padding: 3px 8px; border-radius: 6px;
      background: rgba(255, 245, 225, 0.06); border: 1px solid rgba(208, 169, 98, 0.25);
      color: var(--cream);
    }
    .cta-btn {
      margin-top: 4px; width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--gold);
      background: linear-gradient(180deg, rgba(214, 168, 86, 0.35), rgba(145, 102, 38, 0.42));
      color: #fff8e8; font-size: 13px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.18s ease;
    }
    .cta-btn:hover { background: linear-gradient(180deg, rgba(231, 194, 115, 0.48), rgba(170, 120, 44, 0.55)); }

    /* Bottom Controls & Legend */
    .bottom-bar {
      position: absolute; left: 16px; right: 16px; bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      pointer-events: none; z-index: 20;
    }
    .ctrl-group {
      pointer-events: auto;
      display: flex; align-items: center; gap: 8px;
      background: var(--panel-bg);
      border: 1.5px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px 10px;
      backdrop-filter: blur(8px);
    }
    .ctrl-btn {
      background: rgba(255, 242, 214, 0.08);
      color: var(--cream);
      border: 1px solid rgba(208, 169, 98, 0.36);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .ctrl-btn:hover { border-color: var(--gold); background: rgba(231, 194, 115, 0.22); }
    .ctrl-btn.primary { border-color: var(--gold); background: rgba(214, 168, 86, 0.28); font-weight: 700; }
    .zoom-readout { font-size: 12px; color: var(--gold); min-width: 46px; text-align: center; }
    .legend {
      pointer-events: auto;
      display: flex; align-items: center; gap: 14px;
      background: var(--panel-bg);
      border: 1.5px solid var(--panel-border);
      border-radius: 12px;
      padding: 7px 14px; font-size: 12px; color: var(--muted);
      backdrop-filter: blur(8px);
    }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

    /* SVG Interactive Node Styling */
    .chapter-node { cursor: pointer; transition: transform 0.2s ease; }
    .chapter-node:hover .node-ring { stroke: #fff4d2; stroke-width: 3; }
    .node-label-bg { fill: rgba(22, 16, 10, 0.82); stroke: rgba(218, 179, 104, 0.65); stroke-width: 1; }
    .node-label { fill: #f8eed9; font-size: 11px; font-weight: 600; pointer-events: none; }
    .node-ref { fill: #d7b778; font-size: 9px; pointer-events: none; }
    .trail-active {
      stroke-dasharray: 8 6;
      animation: trailFlow 18s linear infinite;
    }
    @keyframes trailFlow {
      from { stroke-dashoffset: 280; }
      to { stroke-dashoffset: 0; }
    }
    .pulse-ring {
      transform-box: fill-box; transform-origin: center;
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(2.15); opacity: 0; }
    }

    @media (max-width: 900px) {
      .dossier { width: 280px; }
      .legend { display: none; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="top-bar">

          <stop offset="100%" stop-color="#9c7e52" />

      <!-- Transformable World Group -->
      <g id="worldGroup">

        <rect x="-400" y="-250" width="2400" height="1460" fill="url(#parchmentGrad)" />

// Historical migration route polylines (connecting chapters + Ur/Haran/Shechem waypoints)
const TRAILS = [
  { id: 'trail_patriarchs', eraId: 'patriarchs', color: '#e7c273', pts: [[1480,380],[1210,165],[860,185],[640,395],[616,462],[695,266],[604,545],[562,618],[752,422]] },
  { id: 'trail_exodus', eraId: 'exodus', color: '#e69b4e', pts: [[260,720],[378,766],[482,816],[562,618]] },
  { id: 'trail_conquest', eraId: 'conquest', color: '#d96652', pts: [[735,478],[690,472],[658,478],[616,462],[660,368]] },
  { id: 'trail_kingdom', eraId: 'kingdom', color: '#9cc2f0', pts: [[604,545],[618,504]] },
];

// State
let activeEra = 'all';
let selectedId = 'bethel-ai';
let showCh1Detail = false;
let scale = 1.0;
let tx = 0, ty = 0;
let isDragging = false, dragStart = { x: 0, y: 0 };
let tourTimer = null;

const svg = document.getElementById('mapSvg');
const worldGroup = document.getElementById('worldGroup');
const trailsLayer = document.getElementById('trailsLayer');
const fogLayer = document.getElementById('fogLayer');
const nodesLayer = document.getElementById('nodesLayer');
const ch1Overlay = document.getElementById('ch1TacticalOverlay');
const dossier = document.getElementById('dossier');
const eraBar = document.getElementById('eraBar');
const zoomReadout = document.getElementById('zoomReadout');

function applyTransform(smooth = false) {
  worldGroup.style.transition = smooth ? 'transform 0.65s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
  worldGroup.setAttribute('transform', `translate(${tx.toFixed(1)}, ${ty.toFixed(1)}) scale(${scale.toFixed(3)})`);
  zoomReadout.textContent = `${Math.round(scale * 100)}%`;
}

function focusOn(wx, wy, targetScale = 1.85) {
  scale = Math.max(0.75, Math.min(3.2, targetScale));
  tx = 720 - wx * scale; // slightly left of center so right dossier doesn't cover node
  ty = 480 - wy * scale;
  applyTransform(true);
}

function renderEraButtons() {
  eraBar.innerHTML = '';
  ERAS.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'era-btn' + (e.id === activeEra ? ' active' : '');
    btn.textContent = e.label;
    btn.onclick = () => {
      stopTour();
      activeEra = e.id;
      showCh1Detail = false;
      renderAll();
      const first = CHAPTERS.find(c => activeEra === 'all' || c.eraId === activeEra);
      if (first) {
        selectedId = first.id;
        renderDossier();
        if (activeEra === 'all') {
          scale = 1.0; tx = 0; ty = 0; applyTransform(true);
        } else {
          focusOn(first.x, first.y, 1.55);
        }
      }
    };
    eraBar.appendChild(btn);
  });
}

function renderTrailsAndFog() {
  trailsLayer.innerHTML = '';
  // Subtle historical Ur & Haran origin markers
  const origins = [
    { x: 1480, y: 380, label: '吾珥（创 11:31）' },
    { x: 1210, y: 165, label: '哈兰（创 12:4）' },
    { x: 640, y: 395, label: '示剑（创 12:6）' },
  ];
  origins.forEach(o => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('opacity', activeEra === 'all' || activeEra === 'patriarchs' ? '0.88' : '0.25');
    g.innerHTML = `
      <circle cx="${o.x}" cy="${o.y}" r="4.5" fill="#e7c273" stroke="#2a1d10" stroke-width="1.5" />
      <text x="${o.x + 8}" y="${o.y + 4}" fill="#4d3518" font-size="10.5" font-weight="700">${o.label}</text>
    `;
    trailsLayer.appendChild(g);
  });

  TRAILS.forEach(t => {
    const active = activeEra === 'all' || activeEra === t.eraId;
    const d = 'M ' + t.pts.map(p => `${p[0]},${p[1]}`).join(' L ');
    const base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    base.setAttribute('d', d);
    base.setAttribute('stroke', t.color);
    base.setAttribute('stroke-width', active ? '3.2' : '1.6');
    base.setAttribute('stroke-opacity', active ? '0.86' : '0.22');
    if (active) base.setAttribute('class', 'trail-active');
    trailsLayer.appendChild(base);
  });

  // Fog visualization for non-selected / locked military vs unvisited regions
  fogLayer.innerHTML = '';
  CHAPTERS.forEach(c => {
    if (c.status === 'current' || c.status === 'prologue') return;
    if (activeEra !== 'all' && c.eraId !== activeEra) return;
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', c.x);
    circle.setAttribute('cy', c.y);
    circle.setAttribute('r', c.fogMode === 'military' ? '30' : '26');
    circle.setAttribute('fill', c.fogMode === 'military' ? 'rgba(92, 28, 22, 0.20)' : 'rgba(28, 52, 78, 0.16)');
    circle.setAttribute('stroke', c.fogMode === 'military' ? 'rgba(217, 102, 82, 0.45)' : 'rgba(110, 166, 214, 0.38)');
    circle.setAttribute('stroke-dasharray', '4 4');
    fogLayer.appendChild(circle);
  });
}

function renderNodes() {
  nodesLayer.innerHTML = '';
  CHAPTERS.forEach(c => {
    const visible = activeEra === 'all' || c.eraId === activeEra;
    const isSel = c.id === selectedId;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'chapter-node');
    g.setAttribute('opacity', visible ? '1' : '0.22');

    const fillCol = c.status === 'current' ? '#f0c869'
      : c.fogMode === 'military' ? '#d96652' : '#6ea6d6';

    const labelW = Math.max(88, c.titleZh.length * 11 + 16);
    const lx = c.x + 14;
    const ly = c.y - 14;

    g.innerHTML = `
      ${c.status === 'current' || isSel ? `<circle class="pulse-ring" cx="${c.x}" cy="${c.y}" r="11" fill="none" stroke="${fillCol}" stroke-width="2" />` : ''}
      <circle class="node-ring" cx="${c.x}" cy="${c.y}" r="${isSel ? 11 : 8.5}" fill="#1d150e" stroke="${isSel ? '#fff4d2' : fillCol}" stroke-width="${isSel ? 3 : 2.2}" filter="url(#softGlow)" />
      <circle cx="${c.x}" cy="${c.y}" r="${isSel ? 5.5 : 4.2}" fill="${fillCol}" />
      <text x="${c.x}" y="${c.y + 3}" text-anchor="middle" fill="#18120c" font-size="8.5" font-weight="800" pointer-events="none">${c.index === 0 ? '序' : c.index}</text>
      <g transform="translate(${lx}, ${ly})" opacity="${isSel || visible ? 0.96 : 0.35}">
        <rect class="node-label-bg" x="0" y="0" width="${labelW}" height="28" rx="6" />
        <text class="node-label" x="7" y="13">${c.titleZh}</text>
        <text class="node-ref" x="7" y="23">${c.ref} · ${c.protagonist}</text>
      </g>
    `;
    g.onclick = (ev) => {
      ev.stopPropagation();
      stopTour();
      selectedId = c.id;
      showCh1Detail = false;
      renderAll();
      focusOn(c.x, c.y, Math.max(scale, 1.65));
    };
    nodesLayer.appendChild(g);
  });

  ch1Overlay.setAttribute('opacity', showCh1Detail ? '1' : '0');
}

function renderDossier() {
  const c = CHAPTERS.find(x => x.id === selectedId) || CHAPTERS[1];
  const fogBadge = c.fogMode === 'military'
    ? '<span class="badge mil">军事战争迷雾</span>'
    : '<span class="badge unv">未抵达 / 未听闻</span>';

  dossier.innerHTML = `
    <div class="dossier-era">
      <span>${c.eraZh}</span>
      ${fogBadge}
    </div>
    <h2>${c.titleZh}</h2>
    <div class="dossier-meta">
      <div><div class="meta-lbl">核心主角</div><div class="meta-val">${c.protagonist}</div></div>
      <div><div class="meta-lbl">经文依据</div><div class="meta-val">${c.ref}</div></div>
      <div><div class="meta-lbl">地理锚点</div><div class="meta-val">${c.locationZh}</div></div>
      <div><div class="meta-lbl">当前状态</div><div class="meta-val">${c.status === 'current' ? 'Godot 4.7 v25 已实装' : c.status === 'prologue' ? '序章规划' : '后续章节待解锁'}</div></div>
    </div>
    <div class="sec-title">章节脉络</div>
    <p>${c.summary}</p>
    <div class="sec-title">经文正典锚点（Canon Anchor · 不可篡改）</div>
    <p>${c.canonAnchor}</p>
    <div class="sec-title">原创策略玩法（Adaptation）</div>
    <div class="tag-row">${c.adaptations.map(a => `<span class="pill">${a}</span>`).join('')}</div>
    <div class="sec-title">同地点的时代演变</div>
    <p>${c.evolution}</p>
    ${c.id === 'bethel-ai' ? `<button class="cta-btn" id="btnToggleCh1">${showCh1Detail ? '收起第一章 128×96 七区纵深图' : '🔍 展开第一章 128×96 七区纵深图'}</button>` : ''}
  `;

  const btnCh1 = document.getElementById('btnToggleCh1');
  if (btnCh1) {
    btnCh1.onclick = () => {
      showCh1Detail = !showCh1Detail;
      ch1Overlay.setAttribute('opacity', showCh1Detail ? '1' : '0');
      focusOn(632, 464, showCh1Detail ? 2.55 : 1.65);
      renderDossier();
    };
  }
}

function renderAll() {
  renderEraButtons();
  renderTrailsAndFog();
  renderNodes();
  renderDossier();
}

// Pan & Zoom interactions
const viewport = document.getElementById('viewport');
viewport.addEventListener('mousedown', (e) => {
  stopTour();
  isDragging = true;
  viewport.classList.add('dragging');
  dragStart = { x: e.clientX - tx, y: e.clientY - ty };
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  tx = e.clientX - dragStart.x;
  ty = e.clientY - dragStart.y;
  applyTransform(false);
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  stopTour();
  const factor = e.deltaY < 0 ? 1.14 : 0.88;
  const newScale = Math.max(0.75, Math.min(3.2, scale * factor));
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (1600 / rect.width);
  const my = (e.clientY - rect.top) * (960 / rect.height);
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  applyTransform(false);
}, { passive: false });

document.getElementById('btnZoomIn').onclick = () => { stopTour(); scale = Math.min(3.2, scale * 1.25); applyTransform(true); };
document.getElementById('btnZoomOut').onclick = () => { stopTour(); scale = Math.max(0.75, scale * 0.80); applyTransform(true); };
document.getElementById('btnReset').onclick = () => {
  stopTour(); activeEra = 'all'; showCh1Detail = false;
  scale = 1.0; tx = 0; ty = 0;
  renderAll(); applyTransform(true);
};

function stopTour() {
  if (tourTimer) { clearInterval(tourTimer); tourTimer = null; }
  document.getElementById('btnTour').textContent = '▶ 沿应许之路巡礼';
}

document.getElementById('btnTour').onclick = () => {
  if (tourTimer) { stopTour(); return; }
  activeEra = 'all'; showCh1Detail = false;
  let step = 0;
  document.getElementById('btnTour').textContent = '⏹ 停止巡礼';
  const visit = () => {
    const c = CHAPTERS[step % CHAPTERS.length];
    selectedId = c.id;
    renderAll();
    focusOn(c.x, c.y, 1.85);
    step++;
  };
  visit();
  tourTimer = setInterval(visit, 2600);
};

renderAll();
applyTransform(false);
</script>
